[mypy]
python_version = 3.13
files = app/core,app/api,app/schemas,app/db,app/main.py
disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = False
warn_return_any = False
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True
strict_equality = True
exclude = (?x)(^alembic/|^tests/)
plugins = sqlalchemy.ext.mypy.plugin
follow_imports = skip

[mypy-app.api.*]
disallow_untyped_defs = False
check_untyped_defs = False

[mypy-app.models.*]
ignore_errors = True

[mypy-app.repositories.*]
ignore_errors = True

[mypy-app.services.*]
ignore_errors = True

[mypy-argon2.*]
ignore_missing_imports = True

[mypy-jose.*]
ignore_missing_imports = True

[mypy-nanoid.*]
ignore_missing_imports = True

[mypy-python_dotenv.*]
ignore_missing_imports = True

[mypy-email_validator.*]
ignore_missing_imports = True
