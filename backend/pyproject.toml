[project]
name = "wep-education-backend"
version = "1.0.0"
description = "Web Education Platform - Backend API"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Kerrodar", email = "kirill555dg@github.com" }
]

dependencies = [
    # FastAPI framework
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    
    # Database
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    
    # PostgreSQL driver (опционально, раскомментируйте при использовании PostgreSQL)
    # "psycopg2-binary>=2.9.0",
    # "asyncpg>=0.29.0",  # для асинхронной работы
    
    # Pydantic for validation and settings
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    
    # Security
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.6",
    
    # Utils
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
    
    # Code quality
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    
    # Development tools
    "ipython>=8.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

