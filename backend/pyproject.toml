[project]
name = "wep-education-backend"
version = "1.0.0"
description = "Web Education Platform - Backend API"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Kerrodar", email = "kirill555dg@github.com" }]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W"]
ignore = []

